name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item build/Release/DiscordPresenceManager.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/package/
          Copy-Item third_party/LICENSE-json.MIT dist/package/
          Compress-Archive dist/package/* dist/DiscordPresenceManager-Windows-x64.zip
          $hash = (Get-FileHash dist/DiscordPresenceManager-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DiscordPresenceManager-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordPresenceManager-Windows-x64
          path: |
            dist/DiscordPresenceManager-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/DiscordPresenceManager-Windows-x64.zip dist/SHA256SUMS.txt --title "Rich Presence Manager $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
