name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item build/Release/DiscordPresenceManager.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/package/
          Copy-Item third_party/LICENSE-json.MIT dist/package/
          Compress-Archive dist/package/* dist/DiscordPresenceManager-Windows-x64.zip
          $hash = (Get-FileHash dist/DiscordPresenceManager-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DiscordPresenceManager-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordPresenceManager-Windows-x64
          path: |
            dist/DiscordPresenceManager-Windows-x64.zip
            dist/SHA256SUMS.txt
  portable:
    name: Portable ZIP / ${{ matrix.os }}
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: DiscordPresenceManager-Windows-x64
          path: portable/current
      - name: Audit and launch the packaged EXE without developer PATH
        run: python scripts/check-portable.py portable/current/DiscordPresenceManager-Windows-x64.zip portable/current/SHA256SUMS.txt --report portable/reports/current.json
      - name: Download the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force portable/published | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern DiscordPresenceManager-Windows-x64.zip --pattern SHA256SUMS.txt --dir portable/published
          if ($LASTEXITCODE) { throw 'Published release download failed' }
      - name: Verify the EXE users download from Releases
        run: python scripts/check-portable.py portable/published/DiscordPresenceManager-Windows-x64.zip portable/published/SHA256SUMS.txt --report portable/reports/published.json
      - name: Save portability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: portable/reports/*.json
          if-no-files-found: error
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DiscordPresenceManager-Windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/DiscordPresenceManager-Windows-x64.zip dist/SHA256SUMS.txt --title "Presence Studio $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
